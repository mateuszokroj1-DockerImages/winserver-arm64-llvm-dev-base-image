name: Windows Server ARM64 - pull request CI

env:
  tag: mateuszokroj1/winserver-arm64-llvm-dev-base:latest

on:
  pull_request:
    branches: [ "main", "releases/*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-11-arm

    steps:
      - name: Git checkout
        uses: actions/checkout@v6.1.0

      - name: Check Windows features and install Docker Engine
        run: |
          foreach ($featureName in @('Containers', 'Microsoft-Hyper-V-All')) {
            try {
              $feature = Get-WindowsOptionalFeature -Online -FeatureName $featureName -ErrorAction Stop
              Write-Host "Windows feature $featureName state: $($feature.State)"
            } catch {
              Write-Warning "Could not query Windows feature ${featureName}: $($_.Exception.Message)"
            }
          }

          choco install docker-engine --version=29.8.1 --exact --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey failed to install docker-engine (exit code $LASTEXITCODE)" }
        shell: powershell

      - name: Ensure Docker Engine is running
        run: |
          $service = Get-Service -Name docker -ErrorAction Stop
          if ($service.Status -ne 'Running') {
            Start-Service -Name docker
          }

          $deadline = (Get-Date).AddSeconds(60)
          do {
            docker info
            if ($LASTEXITCODE -eq 0) {
              Write-Host 'Docker Engine is ready.'
              exit 0
            }
            Start-Sleep -Seconds 2
          } while ((Get-Date) -lt $deadline)

          throw 'Docker Engine did not become ready within 60 seconds.'
        shell: powershell

      - name: Docker Login
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_READ_KEY }}

      - name: Docker build
        run: docker build --platform windows/arm64 --pull --tag ${{ env.tag }} .

      - name: Analyze with Docker Scout
        uses: docker/scout-action@v1.26.0
        with:
          command: cves
          image: ${{ env.tag }}
          exit-code: true
